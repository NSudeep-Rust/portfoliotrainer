<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#cyber-grad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Shield Shape -->
  <path d="M32 10 L48 16 V28 C48 39.5 41 49.5 32 54 C23 49.5 16 39.5 16 28 V16 L32 10 Z" fill="rgba(0, 242, 254, 0.08)" stroke="url(#cyber-grad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Terminal / Code Symbol -->
  <path d="M25 25 L31 31 L25 37" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="33" y1="37" x2="39" y2="37" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>